<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<title>Juegos · Juan Manuel Ramírez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --h: 222;                       /* tono del tema (cambia según el mes) */
    --bg1: hsl(var(--h) 70% 22%);
    --bg2: hsl(calc(var(--h) + 20) 75% 8%);
    --ink: #f4f6ff;
    --dim: rgba(244,246,255,.55);
    --faint: rgba(244,246,255,.18);
    --item: 74px;                   /* alto de cada fila del menú */
    --row: 46vh;                    /* altura donde queda el juego elegido */
    --gap: 120px;                   /* espacio para el ícono de categoría */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg2);color:var(--ink);
    font-family:"Saira",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- fondo: degradado + portada borrosa + ondas ---------- */
  .bg{position:fixed;inset:0;background:radial-gradient(120% 90% at 30% 20%,var(--bg1),var(--bg2) 70%);transition:background 1.2s}
  .pic{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);
    opacity:0;transition:opacity .7s ease,background-image .7s}
  .pic.on{opacity:.16}
  canvas#wave{position:fixed;inset:0;width:100%;height:100%;mix-blend-mode:screen}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}

  /* ---------- barra superior ---------- */
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(14px + env(safe-area-inset-top)) clamp(16px,4vw,48px) 0;font-weight:400;letter-spacing:.04em;z-index:5}
  .top .who{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.18em}
  .status{display:flex;gap:14px;align-items:center;font-size:15px}
  .bat{width:26px;height:12px;border:1.5px solid var(--ink);border-radius:2px;position:relative;opacity:.9}
  .bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}
  .bat i{position:absolute;inset:1.5px;background:var(--ink);border-radius:1px;width:calc(100% - 3px)}
  .snd{opacity:.75;font-size:15px;padding:4px}
  .snd:hover{opacity:1}

  /* ---------- categoría (fila horizontal) ---------- */
  .cat{position:fixed;left:clamp(16px,9vw,150px);top:calc(var(--row) - 118px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3}
  .cat svg{width:52px;height:52px;filter:drop-shadow(0 0 10px rgba(255,255,255,.55))}
  .cat span{font-size:14px;font-weight:500;letter-spacing:.08em}

  /* ---------- lista vertical de juegos ---------- */
  .list{position:fixed;left:clamp(16px,9vw,150px);top:var(--row);list-style:none;z-index:3;
    transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .item{height:var(--item);display:flex;align-items:center;gap:18px;opacity:.5;transition:opacity .25s;width:max-content;max-width:calc(100vw - 32px)}
  .item button{display:flex;align-items:center;gap:18px;text-align:left;padding:4px 10px 4px 0}
  .item .umd{--s:48px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .item .t{font-size:17px;font-weight:400;white-space:nowrap;transition:font-size .25s}
  .item .s{display:none;font-size:13px;color:var(--dim);font-weight:300}
  .item.sel{opacity:1}
  .item.sel .umd{transform:scale(1.35);transform-origin:center}
  .item.sel .t{font-size:22px;font-weight:600;text-shadow:0 0 18px rgba(255,255,255,.5)}
  .item.sel .s{display:block}
  .item.above{opacity:.28;transform:translateY(calc(var(--gap) * -1))}
  .item{transition:opacity .25s,transform .32s cubic-bezier(.2,.8,.2,1)}
  .item .new{font-size:10px;font-weight:700;letter-spacing:.12em;background:#ff3d5a;color:#fff;padding:1px 6px;border-radius:3px;margin-left:8px;vertical-align:3px}

  /* ---------- UMD (disco en su carcasa) ---------- */
  .umd{--s:200px;width:var(--s);height:calc(var(--s) * 1.06);position:relative;flex:none;
    border-radius:calc(var(--s)*.09) calc(var(--s)*.09) calc(var(--s)*.14) calc(var(--s)*.14);
    background:
      linear-gradient(155deg,rgba(255,255,255,.35),rgba(255,255,255,.04) 38%,rgba(255,255,255,0) 60%,rgba(255,255,255,.12)),
      linear-gradient(180deg,#2b2f3a,#11131a);
    box-shadow:0 calc(var(--s)*.05) calc(var(--s)*.12) rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.22)}
  .umd .win{position:absolute;left:8%;top:6%;width:84%;aspect-ratio:1;border-radius:50%;overflow:hidden;
    box-shadow:inset 0 0 0 calc(var(--s)*.012) rgba(0,0,0,.6),0 0 0 calc(var(--s)*.012) rgba(255,255,255,.12)}
  .umd .disc{position:absolute;inset:0;border-radius:50%;background:var(--lab);background-size:cover;background-position:center}
  .umd .disc::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,0,128,.22),rgba(0,255,255,.22),rgba(255,255,0,.2),rgba(255,0,128,.22));mix-blend-mode:overlay}
  .umd .disc::after{content:"";position:absolute;left:50%;top:50%;width:20%;height:20%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,#0b0d12 32%,#c9ced8 34%,#8f96a3 60%,#dfe3ea 62%,#9aa1ad 100%);box-shadow:0 0 0 calc(var(--s)*.008) rgba(0,0,0,.4)}
  .umd .gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.1))}
  .umd .slot{position:absolute;left:30%;right:30%;bottom:4.5%;height:3.2%;border-radius:2px;background:rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.15)}
  .lab-text{position:absolute;inset:0;display:grid;place-items:start center;padding-top:22%;text-align:center;font-weight:800;line-height:.9;
    font-size:calc(var(--s)*.12);letter-spacing:-.01em;padding-left:14%;padding-right:14%;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .spin .disc{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- disco grande + ficha ---------- */
  .hero{position:fixed;right:clamp(16px,8vw,140px);top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
  .hero .umd{--s:min(30vw,340px)}
  .hero .umd.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes swap{from{transform:translateY(18px) rotateY(-35deg) scale(.92);opacity:0}to{transform:none;opacity:1}}
  .info{width:min(30vw,340px);text-align:center}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .tag{font-size:12px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--faint)}
  .tag.cam{background:rgba(255,61,90,.25);border-color:rgba(255,61,90,.6)}
  .play{margin-top:16px;display:inline-flex;align-items:center;gap:10px;padding:10px 26px;border-radius:999px;
    background:rgba(255,255,255,.92);color:#0b1530;font-weight:700;letter-spacing:.08em;box-shadow:0 0 30px rgba(255,255,255,.35);transition:transform .15s}
  .play:hover{transform:scale(1.05)}
  .play .x{width:22px;height:22px;border-radius:50%;border:2px solid #0b1530;display:grid;place-items:center;font-size:12px;line-height:1}

  /* ---------- ayudas abajo ---------- */
  .hints{position:fixed;right:clamp(16px,4vw,48px);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:18px;font-size:13px;color:var(--dim);z-index:5}
  .hints b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;border:1.5px solid var(--dim);font-size:11px;margin-right:6px;color:var(--ink)}

  /* ---------- arranque del juego ---------- */
  .boot{position:fixed;inset:0;background:#000;z-index:10;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
  .boot.on{opacity:1;pointer-events:auto}
  .boot .umd{--s:150px}
  .boot.on .disc{animation:spin .5s linear infinite}
  .boot p{margin-top:26px;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);text-align:center}
  .boot .bar{margin:14px auto 0;width:180px;height:2px;background:rgba(255,255,255,.15);overflow:hidden}
  .boot .bar i{display:block;height:100%;width:0;background:#fff}
  .boot.on .bar i{animation:load 1.1s ease-in forwards}
  @keyframes load{to{width:100%}}

  /* ---------- celular ---------- */
  @media (max-width:760px){
    :root{--item:64px;--row:68vh;--gap:84px}
    .top .who{display:none}
    .top{justify-content:flex-end}
    .item.above{opacity:0}
    .hero{left:0;right:0;top:calc(64px + env(safe-area-inset-top));transform:none;gap:10px}
    .hero .umd{--s:min(36vw,150px)}
    .info{width:auto;padding:0 16px}
    .info .tags{display:none}
    .play{margin-top:4px;padding:8px 22px;font-size:14px}
    .cat{top:calc(var(--row) - 96px);left:16px;flex-direction:row;gap:10px}
    .cat svg{width:34px;height:34px}
    .list{left:16px}
    .item .umd{--s:40px}
    .item .t{font-size:16px}
    .item.sel .t{font-size:19px}
    .hints{display:none}
  }
  @media (max-height:520px) and (min-width:761px){ :root{--item:60px} .hero .umd{--s:min(24vw,220px)} }
  @media (prefers-reduced-motion:reduce){ .spin .disc,.boot.on .disc{animation:none} .list{transition:none} }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="pic" id="pic"></div>
  <canvas id="wave" aria-hidden="true"></canvas>
  <div class="vignette"></div>

  <header class="top">
    <span class="who">Juan Manuel Ramírez · Juegos</span>
    <div class="status">
      <button class="snd" id="snd" aria-label="Sonido">🔊</button>
      <span id="clock"></span>
      <span class="bat" aria-hidden="true"><i></i></span>
    </div>
  </header>

  <div class="cat" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="20" width="52" height="26" rx="13"/>
      <path d="M20 28v10M15 33h10"/>
      <circle cx="42" cy="29" r="2.4" fill="#fff"/><circle cx="48" cy="35" r="2.4" fill="#fff"/>
      <circle cx="36" cy="35" r="2.4" fill="#fff"/><circle cx="42" cy="41" r="2.4" fill="#fff"/>
    </svg>
    <span>Juego</span>
  </div>

  <ul class="list" id="list" role="listbox" aria-label="Juegos"></ul>

  <section class="hero" aria-live="polite">
    <div id="big"></div>
    <div class="info">
      <div class="tags" id="tags"></div>
      <button class="play" id="play"><span class="x">✕</span>JUGAR</button>
    </div>
  </section>

  <div class="hints"><span><b>↑↓</b>Elegir</span><span><b>Enter</b>Jugar</span></div>

  <div class="boot" id="boot" aria-hidden="true">
    <div><div id="bootDisc"></div><p id="bootTxt">Cargando</p><div class="bar"><i></i></div></div>
  </div>

<script>
(() => {
  const GAMES = [
    { id:"fuego-305", t:"FUEGO 305", s:"Baloncesto en realidad aumentada · Miami", tags:["Deportes","Cámara","PC y celular"], cam:true, nuevo:true, c:["#ff4d00","#e4003a"] },
    { id:"golazo-ar", t:"Golazo AR", s:"Penaltis en realidad aumentada", tags:["Fútbol","Cámara"], cam:true, c:["#00b36b","#004d2e"] },
    { id:"encaja", t:"ENCAJA", s:"Pasa tu cuerpo por la figura del muro", tags:["Fiesta","Cámara","Multijugador"], cam:true, c:["#ffcc00","#ff6a00"] },
    { id:"eye-of-a-tiger", t:"Eye of a Tiger", s:"Boxeo con tu cuerpo frente a la cámara", tags:["Boxeo","Cámara","En línea 1 vs 1"], cam:true, img:true },
    { id:"van-helsing", t:"Van Helsing", s:"Caza leyendas, Drácula y mitos griegos", tags:["Acción 3D","Terror"], img:true },
    { id:"taxi-furia", t:"Taxi Furia", s:"Disparos en primera persona con un taxista", tags:["Acción 3D","Oleadas"], img:true },
    { id:"ace-combat", t:"Ace Combat", s:"Combate aéreo en 3D", tags:["Aviones","Acción 3D"], img:true },
    { id:"super-gol", t:"Super Gol", s:"Fútbol callejero con poderes", tags:["Fútbol","1 o 2 jugadores"], img:true },
    { id:"enjambre-galactico", t:"Enjambre Galáctico", s:"Arcade espacial de naves", tags:["Arcade","Naves"], img:true },
    { id:"zhuky-pong", t:"Zhuky Pong", s:"Ping pong contra Zhuky en la playa", tags:["Arcade","Ping pong"], img:true },
  ];

  /* tema por mes, como la consola */
  const HUES = [210,45,95,330,140,195,175,215,280,30,222,0];
  document.documentElement.style.setProperty("--h", HUES[new Date().getMonth()]);

  const $ = s => document.querySelector(s);
  const list = $("#list"), big = $("#big"), tags = $("#tags"), pic = $("#pic");

  const umd = (g, spin) => {
    const lab = g.img ? `url("portadas/${g.id}.webp")` : `linear-gradient(135deg,${g.c[0]},${g.c[1]})`;
    const txt = g.img ? "" : `<span class="lab-text">${g.t}</span>`;
    return `<div class="umd${spin ? " spin" : ""}" style='--lab:${lab}'><div class="win"><div class="disc">${txt}</div></div><div class="gl"></div><div class="slot"></div></div>`;
  };

  list.innerHTML = GAMES.map((g, i) => `
    <li class="item" role="option" data-i="${i}">
      <button type="button" tabindex="-1">${umd(g)}<span><span class="t">${g.t}${g.nuevo ? '<span class="new">NUEVO</span>' : ""}</span><span class="s">${g.s}</span></span></button>
    </li>`).join("");
  const items = [...list.children];

  let sel = 0;
  try { const v = +localStorage.getItem("juegos-sel"); if (v >= 0 && v < GAMES.length) sel = v; } catch (e) {}

  /* sonidos cortos */
  let ac = null, sound = true;
  try { sound = localStorage.getItem("juegos-snd") !== "0"; } catch (e) {}
  const sndBtn = $("#snd");
  const paintSnd = () => sndBtn.textContent = sound ? "🔊" : "🔇";
  paintSnd();
  sndBtn.onclick = () => { sound = !sound; paintSnd(); try { localStorage.setItem("juegos-snd", sound ? "1" : "0"); } catch (e) {} };
  const beep = (f, d = .05, v = .05, type = "sine") => {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  };

  const render = (anim) => {
    const h = items[0].offsetHeight;
    list.style.transform = `translateY(${-(sel * h) - h / 2}px)`;
    items.forEach((el, i) => { el.classList.toggle("sel", i === sel); el.classList.toggle("above", i < sel); el.setAttribute("aria-selected", i === sel); });
    const g = GAMES[sel];
    big.innerHTML = umd(g, true);
    if (anim) big.firstElementChild.classList.add("swap");
    tags.innerHTML = g.tags.map(t => `<span class="tag${t === "Cámara" ? " cam" : ""}">${t}</span>`).join("");
    pic.style.backgroundImage = g.img ? `url("portadas/${g.id}.webp")` : `linear-gradient(135deg,${g.c[0]},${g.c[1]})`;
    pic.classList.add("on");
    try { localStorage.setItem("juegos-sel", sel); } catch (e) {}
  };

  const move = (d) => {
    const n = Math.max(0, Math.min(GAMES.length - 1, sel + d));
    if (n === sel) { beep(180, .08, .04, "triangle"); return; }
    sel = n; beep(1250, .035); render(true);
  };

  let booting = false;
  const play = () => {
    if (booting) return; booting = true;
    const g = GAMES[sel];
    beep(880, .08, .06); setTimeout(() => beep(1320, .18, .06), 90);
    $("#bootDisc").innerHTML = umd(g);
    $("#bootTxt").textContent = "Cargando " + g.t;
    $("#boot").classList.add("on");
    const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 200 : 1200;
    setTimeout(() => { location.href = g.id + "/"; }, wait);
  };

  /* teclado */
  addEventListener("keydown", e => {
    if (booting) return;
    if (["ArrowDown","s","S"].includes(e.key)) { move(1); e.preventDefault(); }
    else if (["ArrowUp","w","W"].includes(e.key)) { move(-1); e.preventDefault(); }
    else if (["Enter"," ","x","X"].includes(e.key)) { play(); e.preventDefault(); }
  });

  /* ratón, rueda y toque */
  items.forEach((el, i) => el.addEventListener("click", () => { if (i === sel) play(); else { sel = i; beep(1250, .035); render(true); } }));
  $("#play").addEventListener("click", play);
  big.addEventListener("click", play);
  let wheelLock = 0;
  addEventListener("wheel", e => { const now = Date.now(); if (now - wheelLock < 140 || Math.abs(e.deltaY) < 8) return; wheelLock = now; move(e.deltaY > 0 ? 1 : -1); }, { passive: true });
  let ty = null, tStart = 0;
  addEventListener("touchstart", e => { ty = e.touches[0].clientY; tStart = sel; }, { passive: true });
  addEventListener("touchmove", e => {
    if (ty === null) return;
    const step = Math.round((ty - e.touches[0].clientY) / 52);
    const n = Math.max(0, Math.min(GAMES.length - 1, tStart + step));
    if (n !== sel) { sel = n; beep(1250, .03); render(true); }
  }, { passive: true });
  addEventListener("touchend", () => { ty = null; });

  /* al volver con "atrás" */
  addEventListener("pageshow", () => { booting = false; $("#boot").classList.remove("on"); });
  addEventListener("resize", () => render(false));

  /* reloj */
  const clock = $("#clock");
  const tick = () => { const d = new Date(); clock.textContent = d.toLocaleDateString("es-CO", { day:"2-digit", month:"2-digit" }) + "  " + d.toLocaleTimeString("es-CO", { hour:"2-digit", minute:"2-digit", hour12:false }); };
  tick(); setInterval(tick, 10000);

  /* ondas de fondo */
  const cv = $("#wave"), cx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; };
  size(); addEventListener("resize", size);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const waves = [
    { a:.09, f:1.3, s:.00022, y:.58, w:1.4, o:.55 },
    { a:.07, f:1.8, s:-.00017, y:.6, w:1, o:.35 },
    { a:.12, f:.9, s:.00012, y:.56, w:60, o:.06 },
    { a:.1, f:1.1, s:-.0001, y:.62, w:110, o:.04 },
  ];
  const draw = (t) => {
    cx.clearRect(0, 0, W, H);
    for (const w of waves) {
      cx.beginPath();
      for (let x = 0; x <= W; x += 8 * dpr) {
        const p = x / W;
        const y = H * w.y + Math.sin(p * Math.PI * 2 * w.f + t * w.s * 6) * H * w.a * Math.sin(p * Math.PI + t * w.s);
        x ? cx.lineTo(x, y) : cx.moveTo(x, y);
      }
      cx.strokeStyle = `rgba(255,255,255,${w.o})`; cx.lineWidth = w.w * dpr; cx.lineCap = "round"; cx.stroke();
    }
    if (!still) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);

  render(false);
})();
</script>
</body>
</html>
