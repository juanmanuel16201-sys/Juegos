<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos — Juan Manuel Ramírez</title>
<style>
  :root{--bg:#0d0f14;--card:#171b24;--fg:#f2f2f2;--accent:#ffcc33}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:32px 16px}
  h1{text-align:center;margin:0 0 28px;letter-spacing:.05em}
  ul{list-style:none;padding:0;margin:0 auto;max-width:900px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  a{display:block;padding:22px 16px;background:var(--card);border-radius:12px;color:var(--fg);text-decoration:none;font-weight:700;text-align:center;border:2px solid transparent;transition:.15s}
  a:hover{border-color:var(--accent);transform:translateY(-3px)}
</style>
</head>
<body>
<h1>🎮 JUEGOS</h1>

</ul>
</body>
</html>
